version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: adyapan_postgres
    restart: always
    environment:
      POSTGRES_USER: hrms_user
      POSTGRES_PASSWORD: hrms_password
      POSTGRES_DB: adyapan_hrms
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: adyapan_redis
    restart: always
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: adyapan_backend
    restart: always
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: "postgresql://hrms_user:hrms_password@postgres:5432/adyapan_hrms?schema=public"
      PORT: 4000
      JWT_SECRET: "adyapan-hrms-jwt-secret-key-2026-production-ready"
      JWT_REFRESH_SECRET: "adyapan-hrms-jwt-refresh-secret-key-2026"
    depends_on:
      - postgres
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: adyapan_frontend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
